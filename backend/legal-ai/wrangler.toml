name = "yemen-laws-legal-ai"
main = "src/index.ts"
compatibility_date = "2026-09-01"

[ai]
binding = "AI"

[[d1_databases]]
binding = "DB"
database_name = "yemen-laws-rag"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

[[vectorize]]
binding = "VECTOR_INDEX"
index_name = "yemen-laws-articles"

[vars]
ALLOWED_APP_VERSION = "1.0.0"
MAX_QUESTION_CHARS = "1200"
MAX_RESULTS = "8"
AI_MODEL = "@cf/zai-org/glm-4.7-flash"
EMBEDDING_MODEL = "@cf/baai/bge-m3"
\n# Set with: npx wrangler secret put REINDEX_TOKEN\n